name: Security release gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubectl-service-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test, scan, and inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DAPPER_IMAGE: pasturestack-kubectl-service-dapper:security-gate
      DAPPER_TRIVY_CACHE: /tmp/pasturestack-trivy-cache
      VERSION_OVERRIDE: v0.9.20
    steps:
      - name: Check out the complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the clean source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          df -h /
          docker version
          docker buildx version
          python3 .github/scripts/test_runtime_vulnerability_policy.py
          python3 .github/scripts/test_negative_package_guards.py

      - name: Build the checksum-locked verification environment
        shell: bash
        run: |
          set -euo pipefail
          make dapper-image DAPPER_IMAGE="$DAPPER_IMAGE"
          mkdir -p "$DAPPER_TRIVY_CACHE"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$DAPPER_TRIVY_CACHE:/tmp/trivy-cache" \
            --entrypoint /usr/local/bin/trivy \
            "$DAPPER_IMAGE" \
            image --cache-dir /tmp/trivy-cache --download-db-only

      - name: Run the complete source and product gate
        shell: bash
        run: |
          set -euo pipefail
          make ci \
            DAPPER_IMAGE="$DAPPER_IMAGE" \
            DAPPER_TRIVY_CACHE="$DAPPER_TRIVY_CACHE"

      - name: Check complete product and builder reports
        shell: bash
        run: bash .github/scripts/check-image-policies.sh

      - name: Upload short-lived SBOM and scan evidence
        if: ${{ always() && hashFiles('dist/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-service-security-evidence-${{ github.run_id }}
          path: |
            dist/*.json
            dist/*.tsv
            dist/*.tar
            dist/*.lock
            dist/*-PACKAGES.txt
            dist/images
            dist/SHA256SUMS
            dist/source-revision.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

      - name: Remove verification-only images and cache
        if: always()
        shell: bash
        run: |
          set +e
          if test -f dist/images; then
            xargs --no-run-if-empty docker image rm -f < dist/images
          fi
          docker image rm -f "$DAPPER_IMAGE"
          docker builder prune --all --force
